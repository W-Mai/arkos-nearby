[package]
name = "howff"
version = "0.13.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[features]
default = []
release-bundle = []

[dependencies]
howff-platform = { path = "../nearby-platform" }
howff-menu = { path = "../nearby-menu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
signal-hook = "0.3"
ring = "0.17.14"
roxmltree = "0.21.1"
tar = { version = "0.4.46", default-features = false }
pinyin = { version = "=0.11.0", default-features = false, features = ["plain"] }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
