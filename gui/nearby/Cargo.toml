[package]
name = "arkos-nearby-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[features]
gpu = ["mirui/sdl-gpu", "sound"]
sound = ["mirui/sdl-audio"]

[dependencies]
mirui = { version = "=0.51.0", default-features = false, features = ["std", "quad-aa", "audio"] }
mirx = "=0.51.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[profile.release]
opt-level = 3
strip = true
lto = "thin"

[[example]]
name = "dual_demo"
path = "src/dual_demo.rs"
